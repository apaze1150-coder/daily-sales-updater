<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อัปโหลดปิดยอดขายประจำวัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4">

    <div class="max-w-md mx-auto space-y-4 mb-10">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-md text-center">
            <h1 class="text-xl font-bold">📑 อัปโหลดปิดยอดขายประจำวัน</h1>
            <p class="text-sm opacity-90 mt-1">ประมวลผลแยกกะ CA, A, B, C อัตโนมัติ</p>
        </div>

        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">📅 วันที่ของยอดขาย</label>
                <input type="date" id="sale-date" class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">📂 เลือกไฟล์ Excel ปิดวัน (.xlsx)</label>
                <input type="file" id="excel-file" accept=".xlsx, .xls" class="w-full p-2 border border-slate-200 rounded-xl focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>
        </div>

        <div id="result-box" class="hidden bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-3">
            <h2 class="text-md font-bold text-slate-700 border-b pb-2">📊 ผลรวมยอดขายที่คำนวณได้</h2>
            
            <div class="flex justify-between text-sm py-1 border-b border-dashed">
                <span class="text-slate-500">รอบ CA (00:00 - 05:59):</span>
                <span id="res-ca" class="font-semibold text-slate-700">0.00</span>
            </div>
            <div class="flex justify-between text-sm py-1 border-b border-dashed">
                <span class="text-slate-500">รอบ A (06:00 - 12:59):</span>
                <span id="res-a" class="font-semibold text-slate-700">0.00</span>
            </div>
            <div class="flex justify-between text-sm py-1 bg-blue-50/70 p-2 rounded-lg">
                <span class="font-medium text-blue-800">👉 รวมรอบ A (CA + A):</span>
                <span id="res-sum-a" class="font-bold text-blue-800">0.00</span>
            </div>
            <div class="flex justify-between text-sm py-1 border-b border-dashed">
                <span class="text-slate-500">รอบ B (13:00 - 21:59):</span>
                <span id="res-b" class="font-semibold text-slate-700">0.00</span>
            </div>
            <div class="flex justify-between text-sm py-1 border-b border-dashed">
                <span class="text-slate-500">รอบ C (22:00 - 23:59):</span>
                <span id="res-c" class="font-semibold text-slate-700">0.00</span>
            </div>
            <div class="flex justify-between text-base pt-2 font-bold text-emerald-600">
                <span>ยอดรวมทั้งวัน:</span>
                <span id="res-total">0.00</span>
            </div>

            <button id="save-btn" onclick="sendToGoogleSheets()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] transition-all text-white font-medium text-lg py-3 rounded-xl shadow flex justify-center items-center gap-2">
                ☁️ บันทึกลง Google Sheets
            </button>
        </div>
    </div>

    <script>
        // วาง URL ของ Google Apps Script ที่ได้จากขั้นตอน Deploy ที่นี่
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyrVJ8yuWx0G1RVB88fPhAy1skl5PPXb0Jn3a0-fpcw0zOdEwmqwKcQmlmNuOrzaS3-2g/exec";

        // กำหนดวันที่ปัจจุบันในกล่องเลือกวัน
        document.getElementById('sale-date').valueAsDate = new Date();

        let shiftData = null;

        function sumRowRange(rowArray, startIndex, endIndex) {
            let sum = 0;
            for (let i = startIndex; i <= endIndex; i++) {
                let val = parseFloat(rowArray[i]) || 0;
                sum += val;
            }
            return sum;
        }

        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const sheetData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    let grandTotalRow = null;
                    for (let r = 0; r < sheetData.length; r++) {
                        const row = sheetData[r];
                        if (row && row.some(cell => typeof cell === 'string' && cell.toUpperCase().includes('GRAND TOTAL'))) {
                            grandTotalRow = row;
                            break;
                        }
                    }

                    if (!grandTotalRow) {
                        alert("ไม่พบแถว GRAND TOTAL ในไฟล์ Excel กรุณาตรวจสอบรูปแบบไฟล์ครับ");
                        return;
                    }

                    const valCA = sumRowRange(grandTotalRow, 21, 26); // V ถึง AA
                    const valA  = sumRowRange(grandTotalRow, 3, 9);   // D ถึง J
                    const valB  = sumRowRange(grandTotalRow, 10, 18); // K ถึง S
                    const valC  = sumRowRange(grandTotalRow, 19, 20); // T ถึง U
                    const valTotal = parseFloat(grandTotalRow[28]) || (valCA + valA + valB + valC);

                    shiftData = {
                        date: document.getElementById('sale-date').value,
                        ca: valCA,
                        a: valA,
                        sumA: valCA + valA,
                        b: valB,
                        c: valC,
                        total: valTotal
                    };

                    document.getElementById('res-ca').innerText = valCA.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    document.getElementById('res-a').innerText = valA.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    document.getElementById('res-sum-a').innerText = (valCA + valA).toLocaleString('en-US', { minimumFractionDigits: 2 });
                    document.getElementById('res-b').innerText = valB.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    document.getElementById('res-c').innerText = valC.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    document.getElementById('res-total').innerText = valTotal.toLocaleString('en-US', { minimumFractionDigits: 2 });

                    document.getElementById('result-box').classList.remove('hidden');
                } catch (err) {
                    alert("เกิดข้อผิดพลาดในการอ่านไฟล์ Excel: " + err);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // ส่งข้อมูลแบบ Form ข้ามโดเมนเพื่อเลี่ยงปัญหา CORS บน GitHub Pages
        function sendToGoogleSheets() {
            if (!shiftData) return;

            if (WEB_APP_URL === "PASTE_YOUR_APPS_SCRIPT_URL_HERE" || WEB_APP_URL === "") {
                alert("กรุณาระบุ URL ของ Google Apps Script ในตัวแปร WEB_APP_URL ก่อนครับ");
                return;
            }

            const btn = document.getElementById('save-btn');
            btn.innerText = "⏳ กำลังบันทึกข้อมูล...";
            btn.disabled = true;

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: JSON.stringify(shiftData)
            }).then(() => {
                alert("✅ ส่งข้อมูลบันทึกลง Google Sheets เรียบร้อยแล้ว!");
                btn.innerText = "☁️ บันทึกลง Google Sheets";
                btn.disabled = false;
            }).catch(err => {
                alert("เกิดข้อผิดพลาด: " + err);
                btn.innerText = "☁️ บันทึกลง Google Sheets";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
