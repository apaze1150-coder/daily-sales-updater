<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสรุปยอดขายรายวัน</title>
    <!-- ใช้ Tailwind CSS CDN เวอร์ชันเสถียร -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between text-slate-800">

    <div class="p-4 max-w-md mx-auto w-full space-y-4 mb-24">
        <!-- ส่วนหัวแสดงเวลาปัจจุบัน และปุ่มรีเฟรชเวลา -->
        <div class="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-5 text-white shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">📊 อัปเดตยอดขาย</h1>
                <p class="text-sm opacity-90 mt-0.5">เวลาปัจจุบัน: <span id="current-time" class="font-bold bg-white/20 px-2 py-0.5 rounded">00.00</span></p>
            </div>
            <button onclick="refreshTime()" class="bg-white/20 hover:bg-white/30 active:scale-95 p-2 rounded-xl transition-all text-sm flex items-center gap-1">
                🔄 รีเฟรชเวลา
            </button>
        </div>

        <!-- ช่องกรอกข้อมูลยอดขาย -->
        <div class="bg-white rounded-2xl p-5 shadow-sm space-y-4 border border-slate-100">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">💰 ยอดขายปัจจุบัน</label>
                <input type="number" id="sales-current" placeholder="กรอกยอดขายล่าสุด" class="w-full text-lg p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            
            <hr class="border-slate-100">

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">⏳ ยอดขายเมื่อวาน (ช่วงเวลาเดียวกัน)</label>
                <input type="number" id="sales-yesterday" placeholder="กรอกยอดขายเมื่อวาน" class="w-full text-lg p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">📅 ยอดขาย Week ก่อน (ช่วงเวลาเดียวกัน)</label>
                <input type="number" id="sales-week" placeholder="กรอกยอดขายสัปดาห์ก่อน" class="w-full text-lg p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
        </div>

        <!-- กล่องแสดงตัวอย่างข้อความ (Real-time Preview) -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">ข้อความที่จะคัดลอก (Preview)</h3>
            <div id="preview-box" class="bg-emerald-50/50 text-slate-700 p-4 rounded-xl border border-emerald-100 whitespace-pre-wrap text-[16px] leading-relaxed min-h-[140px]">กรุณากรอกข้อมูลยอดขาย...</div>
        </div>
    </div>

    <!-- ปุ่มคัดลอกข้อความแบบล็อกติดอยู่ด้านล่างจอมือถือ (Sticky Bottom) -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 max-w-md mx-auto w-full z-50">
        <button id="copy-btn" onclick="copyToClipboard()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] transition-all text-white font-medium text-lg py-4 rounded-xl shadow-md flex justify-center items-center gap-2">
            📋 คัดลอกข้อความ
        </button>
    </div>

    <!-- ข้อความแจ้งเตือน (Toast Notification) -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-5 py-2.5 rounded-full text-sm font-medium shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        ✅ คัดลอกข้อความสำเร็จแล้ว!
    </div>

    <script>
        let formattedTime = "";
        let currentDateStr = "";
        let yesterdayDateStr = "";
        let lastWeekDateStr = "";

        // ฟังก์ชันตั้งค่าเวลาปัจจุบันและคำนวณวันที่อัตโนมัติพร้อมปี พ.ศ. ย่อ (26)
        function refreshTime() {
            const now = new Date();
            const yearShort = "26"; // ล็อกเป็นปี พ.ศ. 26 ตามต้องการ
            
            // 1. ฟอร์แมตเวลาปัจจุบัน (HH.mm)
            formattedTime = `${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('current-time').innerText = formattedTime;
            
            // 2. คำนวณวันที่ปัจจุบัน (วัน/เดือน/26)
            currentDateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${yearShort}`;

            // 3. คำนวณวันที่เมื่อวาน (วัน/เดือน/26)
            const yesterday = new Date();
            yesterday.setDate(now.getDate() - 1);
            yesterdayDateStr = `${String(yesterday.getDate()).padStart(2, '0')}/${String(yesterday.getMonth() + 1).padStart(2, '0')}/${yearShort}`;
            
            // 4. คำนวณวันที่สัปดาห์ที่แล้ว (วัน/เดือน/26)
            const lastWeek = new Date();
            lastWeek.setDate(now.getDate() - 7);
            lastWeekDateStr = `${String(lastWeek.getDate()).padStart(2, '0')}/${String(lastWeek.getMonth() + 1).padStart(2, '0')}/${yearShort}`;

            generateText(); // อัปเดต Preview
        }

        // อ้างอิง Elements
        const currentInput = document.getElementById('sales-current');
        const yesterdayInput = document.getElementById('sales-yesterday');
        const weekInput = document.getElementById('sales-week');
        const previewBox = document.getElementById('preview-box');

        // ฟังก์ชันแปลงเลขให้มีคอมมาคั่นหลักพัน
        function formatNumber(num) {
            return Number(num).toLocaleString('en-US');
        }

        // ฟังก์ชันคำนวณส่วนต่างและแสดงสัญลักษณ์ 🔼/🔽 ตามเงื่อนไข
        function calculateDiff(current, target) {
            if (current === "" || target === "") return "";
            const currentNum = parseFloat(current);
            const targetNum = parseFloat(target);
            const diff = currentNum - targetNum;
            const formattedDiff = formatNumber(Math.abs(diff));

            if (diff >= 0) {
                return `🔼 +${formattedDiff}`;
            } else {
                return `🔽 -${formattedDiff}`;
            }
        }

        // ฟังก์ชันสร้างและจัดรูปแบบข้อความที่จะนำไปคัดลอก
        function generateText() {
            const current = currentInput.value;
            const yesterday = yesterdayInput.value;
            const week = weekInput.value;

            if (current === "") {
                previewBox.innerText = "กรุณากรอกข้อมูลยอดขาย...";
                return "";
            }

            // จัดโครงสร้างข้อความพร้อมแสดงปีท้ายวันที่
            let text = `Update ยอดขาย ${currentDateStr}\n เวลา ${formattedTime}\n---------------------------\nยอดขาย \n${formatNumber(current)}\n---------------------------\nเปรียบเทียบยอดขาย\nเมื่อวาน ${yesterdayDateStr}\n`;
            
            text += yesterday !== "" ? calculateDiff(current, yesterday) : "-(กรุณากรอกยอดเมื่อวาน)-";
            text += `\nWeek ${lastWeekDateStr}\n`;
            text += week !== "" ? calculateDiff(current, week) : "-(กรุณากรอกยอด Week ก่อน)-";

            previewBox.innerText = text;
            return text;
        }

        // ดักจับการกรอกข้อมูลเพื่อคำนวณและแสดงผลแบบ Real-time
        [currentInput, yesterdayInput, weekInput].forEach(input => {
            input.addEventListener('input', generateText);
        });

        // เรียกใช้งานเวลาและวันที่ทันทีเมื่อโหลดหน้าเว็บเสร็จ
        window.onload = function() {
            refreshTime();
        };

        // ฟังก์ชันสำหรับคัดลอกข้อความลง Clipboard และแสดง Toast
        function copyToClipboard() {
            const textToCopy = generateText();
            if (!textToCopy) {
                alert("กรุณากรอกยอดขายปัจจุบันก่อนคัดลอกครับ");
                return;
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');
                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0');
                }, 2000);
            }).catch(err => {
                alert('เกิดข้อผิดพลาดในการคัดลอกระบบ: ' + err);
            });
        }
    </script>
</body>
</html>
