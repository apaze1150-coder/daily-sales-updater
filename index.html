<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุปยอดขายประจำวัน ALL KPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 pb-28">

    <div class="max-w-md mx-auto space-y-4">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-md flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">📊 สรุปยอดขายรวม ALL KPT</h1>
                <p class="text-sm opacity-90 mt-0.5">เวลาปัจจุบัน: <span id="current-time" class="font-bold bg-white/20 px-2 py-0.5 rounded">00.00</span></p>
            </div>
            <button onclick="refreshTime()" class="bg-white/20 hover:bg-white/30 active:scale-95 p-2 rounded-xl text-sm flex items-center gap-1 transition-all">
                🔄 รีเฟรช
            </button>
        </div>

        <!-- กล่องข้อมูลและการเชื่อมต่อ Google Sheet -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500">ฐานข้อมูล Google Sheets:</span>
            <button onclick="fetchYesterdayFromSheet()" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg font-medium border border-indigo-200 transition-all">
                📥 ดึงยอดเมื่อวานอัตโนมัติ
            </button>
        </div>

        <!-- ฟอร์มกรอกข้อมูลแต่ละรอบ -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
            
            <!-- รอบ A (+CA) -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-sm font-medium text-slate-700">🌅 ยอดรวมรอบ A (+CA)</label>
                    <span class="text-xs text-slate-400">Target: 2,264,147</span>
                </div>
                <input type="number" id="sales-a" placeholder="กรอกยอดรอบ A รวม CA" class="w-full text-base p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <!-- รอบ B -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-sm font-medium text-slate-700">☀️ ยอดรอบ B</label>
                    <span class="text-xs text-slate-400">Target: 3,428,653</span>
                </div>
                <input type="number" id="sales-b" placeholder="กรอกยอดขายรอบ B" class="w-full text-base p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <!-- รอบ C -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-sm font-medium text-slate-700">🌙 ยอดรอบ C</label>
                    <span class="text-xs text-slate-400">Target: 1,507,200</span>
                </div>
                <input type="number" id="sales-c" placeholder="กรอกยอดขายรอบ C" class="w-full text-base p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <hr class="border-slate-100">

            <!-- ยอดรวมเมื่อวานสำหรับเปรียบเทียบ -->
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">⏳ ยอดรวมทั้งวันของเมื่อวาน</label>
                <input type="number" id="sales-yesterday" placeholder="กดปุ่มดึงข้อมูล หรือกรอกเอง" class="w-full text-base p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 bg-slate-50">
            </div>
        </div>

        <!-- กล่อง Preview ข้อความ -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">ข้อความที่จะคัดลอก (Preview)</h3>
            <pre id="preview-box" class="bg-blue-50/60 text-slate-800 p-4 rounded-xl border border-blue-100 whitespace-pre-wrap text-sm leading-relaxed min-h-[160px] font-mono">กรุณากรอกข้อมูลยอดขาย...</pre>
        </div>
    </div>

    <!-- ปุ่มคัดลอกด้านล่าง -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-100 max-w-md mx-auto w-full z-50">
        <button onclick="copyToClipboard()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] transition-all text-white font-medium text-lg py-3.5 rounded-xl shadow-md flex justify-center items-center gap-2">
            📋 คัดลอกข้อความส่ง LINE
        </button>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-5 py-2.5 rounded-full text-sm font-medium shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        ✅ คัดลอกข้อความสำเร็จแล้ว!
    </div>

    <script>
        // วาง URL ของ Google Apps Script ที่ Deploy ไว้
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTYYuCMdoNCtWtqd_lP54d3hIuTNcKrzRDnfb7YQsRTCRh9kiTYDGJrnOi9okDvYiLiA/exec";

        const TARGET_A = 2264147;
        const TARGET_B = 3428653;
        const TARGET_C = 1507200;
        const TARGET_TOTAL = 7200000;

        let formattedTime = "";
        let currentDateStr = "";
        let yesterdayDateStr = "";

        function refreshTime() {
            const now = new Date();
            const yearShort = "26";
            formattedTime = `${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('current-time').innerText = formattedTime;
            
            currentDateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${yearShort}`;

            const yesterday = new Date();
            yesterday.setDate(now.getDate() - 1);
            yesterdayDateStr = `${String(yesterday.getDate()).padStart(2, '0')}/${String(yesterday.getMonth() + 1).padStart(2, '0')}/${yearShort}`;

            generateText();
        }

        // ฟังก์ชันตัดเศษทศนิยมและใส่คอมมา
        function fmt(val) {
            return Math.round(Number(val) || 0).toLocaleString('en-US');
        }

        function calculateDiffText(current, target) {
            const diff = Math.round(current - target);
            const symbol = diff >= 0 ? "🔼 +" : "🔽 -";
            return `${symbol}${fmt(Math.abs(diff))}`;
        }

        function generateText() {
            const valA = Math.round(parseFloat(document.getElementById('sales-a').value) || 0);
            const valB = Math.round(parseFloat(document.getElementById('sales-b').value) || 0);
            const valC = Math.round(parseFloat(document.getElementById('sales-c').value) || 0);
            const yesterdayTotal = parseFloat(document.getElementById('sales-yesterday').value) || 0;

            const totalCurrent = valA + valB + valC;

            if (!valA && !valB && !valC) {
                document.getElementById('preview-box').innerText = "กรุณากรอกข้อมูลยอดขาย...";
                return "";
            }

            const percentTarget = ((totalCurrent / TARGET_TOTAL) * 100).toFixed(2);

            let msg = `Update สรุปยอดขายรวม ALL KPT ${currentDateStr}\n เวลา ${formattedTime}\n`;
            msg += `---------------------------\n`;
            msg += `รอบ A (+CA): ${fmt(valA).padEnd(9)} (Target ${fmt(TARGET_A)})\n`;
            msg += `รอบ B:       ${fmt(valB).padEnd(9)} (Target ${fmt(TARGET_B)})\n`;
            msg += `รอบ C:       ${fmt(valC).padEnd(9)} (Target ${fmt(TARGET_C)})\n`;
            msg += `---------------------------\n`;
            msg += `ยอดรวมทั้งวัน: ${fmt(totalCurrent)}\n`;
            msg += `---------------------------\n`;
            msg += `เทียบเมื่อวาน ${yesterdayDateStr} (${fmt(yesterdayTotal)})\n`;
            msg += `${calculateDiffText(totalCurrent, yesterdayTotal)}\n`;
            msg += `เป้าหมาย ALL KPT: ${fmt(TARGET_TOTAL)}\n`;
            msg += `${calculateDiffText(totalCurrent, TARGET_TOTAL)} (${percentTarget}%)`;

            document.getElementById('preview-box').innerText = msg;
            return msg;
        }

        // ดึงยอดรวมของเมื่อวานจาก Google Sheet ผ่าน API
        function fetchYesterdayFromSheet() {
            if (APPS_SCRIPT_URL === "PASTE_YOUR_APPS_SCRIPT_URL_HERE" || !APPS_SCRIPT_URL) {
                alert("กรุณาระบุ URL ของ Google Apps Script ก่อนครับ");
                return;
            }

            fetch(APPS_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        // ดึงแถวล่าสุดจาก Sheet
                        const lastRecord = data[data.length - 1];
                        document.getElementById('sales-yesterday').value = Math.round(lastRecord.total);
                        generateText();
                        alert(`✅ ดึงยอดของวันที่ ${lastRecord.date} มาเรียบร้อยแล้ว: ${fmt(lastRecord.total)} บาท`);
                    } else {
                        alert("ไม่พบข้อมูลใน Google Sheet");
                    }
                })
                .catch(err => alert("เกิดข้อผิดพลาดในการดึงข้อมูล: " + err));
        }

        ['sales-a', 'sales-b', 'sales-c', 'sales-yesterday'].forEach(id => {
            document.getElementById(id).addEventListener('input', generateText);
        });

        window.onload = function() {
            refreshTime();
        };

        function copyToClipboard() {
            const text = generateText();
            if (!text) {
                alert("กรุณากรอกยอดขายก่อนคัดลอกครับ");
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');
                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0');
                }, 2000);
            }).catch(err => alert("คัดลอกไม่สำเร็จ: " + err));
        }
    </script>
</body>
</html>
